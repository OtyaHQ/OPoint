# Canonical Opoint production API.
# Private Worker: exposed only through the Otya Core same-origin service binding.
name = "opoint"
main = "backend/src/index.mjs"
compatibility_date = "2026-11-18"
workers_dev = false
keep_vars = false

[vars]
ENVIRONMENT = "production"
PRODUCT_CODE = "OPOINT"
PAYMENT_EXECUTION_ENABLED = "false"
PROVIDER_EXECUTION_ENABLED = "false"
AI_ENABLED = "false"

[observability]
enabled = true
redact_query_string = true

[observability.logs]
enabled = true
head_sampling_rate = 1

[observability.traces]
enabled = true
head_sampling_rate = 0.05

[[d1_databases]]
binding = "DB"
database_name = "opoint-prod-db"
database_id = "06ded416-1ae9-4f28-b50a-d408317ad60c"

[[services]]
binding = "OID"
service = "oid"

name: Verify OtyaPoint backend

on:
  pull_request:
    paths:
      - "backend/**"
      - "wrangler.opoint-staging.toml"
      - ".github/workflows/verify-opoint-backend.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "wrangler.opoint-staging.toml"
      - ".github/workflows/verify-opoint-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opoint-backend-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Backend checks, tests and schema integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.4"
          package-manager-cache: false
      - name: Check Worker and helper syntax
        run: npm --prefix backend run check
      - name: Run backend tests
        run: npm --prefix backend test
      - name: Verify schema snapshot and forward migrations
        run: npm --prefix backend run verify:schema

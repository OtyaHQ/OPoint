name: Deploy isolated OtyaPoint staging API

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DEPLOY-STAGING to deploy the isolated OtyaPoint staging API"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: opoint-api-staging
  cancel-in-progress: false

jobs:
  deploy-opoint-staging:
    name: Validate and deploy private OtyaPoint staging API
    if: github.ref == "refs/heads/main"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22.23.4"
          package-manager-cache: false

      - name: Require explicit staging authority
        shell: bash
        env:
          CONFIRM: ${{ inputs.confirm }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN_STAGING: ${{ secrets.CLOUDFLARE_API_TOKEN_STAGING }}
        run: |
          set -euo pipefail
          test "$CONFIRM" = "DEPLOY-STAGING" || {
            echo "ERROR: staging deployment requires DEPLOY-STAGING"
            exit 1
          }
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN_STAGING"

      - name: Validate backend, work-area migration and schema snapshot
        run: |
          set -euo pipefail
          npm --prefix backend run check
          npm --prefix backend test
          npm --prefix backend run verify:schema

      - name: Require the isolated Otya ID staging service before product cutover
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN_STAGING: ${{ secrets.CLOUDFLARE_API_TOKEN_STAGING }}
        run: |
          set -euo pipefail
          headers=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN_STAGING")
          for endpoint in             "workers/scripts/otya-id-staging"             "workers/scripts/otya-id-staging/subdomain"; do
            response="$(curl --fail --silent --show-error "${headers[@]}"               "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/$endpoint")"
            echo "$response" | jq -e '.success == true' >/dev/null
          done
          curl --fail --silent --show-error "${headers[@]}"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/otya-id-staging/subdomain"             | jq -e '.result.enabled == false and .result.previews_enabled == false' >/dev/null

      - name: Dry-run the private OtyaPoint API Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_STAGING }}
        run: npx --yes wrangler@4.159.0 deploy --dry-run --config wrangler.opoint-staging.toml

      - name: Apply forward-only migrations to the isolated OtyaPoint staging D1
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_STAGING }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.159.0 d1 migrations list opoint-staging-db --remote --config wrangler.opoint-staging.toml
          npx --yes wrangler@4.159.0 d1 migrations apply opoint-staging-db --remote --config wrangler.opoint-staging.toml

      - name: Deploy OtyaPoint staging API with private service binding
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_STAGING }}
        run: npx --yes wrangler@4.159.0 deploy --config wrangler.opoint-staging.toml

      - name: Verify private identity binding and disabled execution features
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN_STAGING: ${{ secrets.CLOUDFLARE_API_TOKEN_STAGING }}
        run: |
          set -euo pipefail
          headers=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN_STAGING")
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/opoint-api-staging"
          settings="$(curl --fail --silent --show-error "${headers[@]}" "$base/settings")"
          echo "$settings" | jq -e '
            .success == true
            and ([.result.bindings[] | select(.name == "OTYA_ID" and .type == "service" and .service == "otya-id-staging")] | length == 1)
            and ([.result.bindings[] | select(.type == "plain_text" and (.name == "PAYMENT_EXECUTION_ENABLED" or .name == "PROVIDER_EXECUTION_ENABLED" or .name == "AI_ENABLED") and .text == "false")] | length == 3)
          ' >/dev/null
          subdomain="$(curl --fail --silent --show-error "${headers[@]}" "$base/subdomain")"
          echo "$subdomain" | jq -e '.success == true and .result.enabled == false and .result.previews_enabled == false' >/dev/null
          echo "The staging API is bound to Otya ID staging, all financial/provider/AI execution flags remain disabled, and public hostnames are off."

      - name: Verify staging D1 schema through read-only metadata query
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN_STAGING: ${{ secrets.CLOUDFLARE_API_TOKEN_STAGING }}
        run: |
          set -euo pipefail
          database_id="$(sed -n 's/^[[:space:]]*database_id[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' wrangler.opoint-staging.toml | head -n 1)"
          test -n "$database_id"
          response="$(curl --fail --silent --show-error             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN_STAGING"             -H "Content-Type: application/json"             -X POST             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$database_id/query"             --data '{"sql":"SELECT name FROM sqlite_master WHERE type IN (\u0027table\u0027,\u0027trigger\u0027)"}')"
          echo "$response" | jq -e '
            .success == true
            and ([.result[0].results[].name] as $names
              | ["companies","branches","staff_memberships","ledger_accounts","cash_accounts","products","sales","journal_entries","journal_lines","payment_intents","payment_attempts","payment_reversals","agency_operations","staff_work_assignments","provider_operator_profiles","issued_receipts"]
              | all(. as $expected | $names | index($expected) != null))
          ' >/dev/null
          echo "Expected core business tables exist in the isolated staging D1."

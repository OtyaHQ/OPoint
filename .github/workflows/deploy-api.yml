name: Deploy OtyaPoint production API

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "wrangler.opoint-production.toml"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: Select DEPLOY only when authorizing the private production Worker release.
        required: true
        type: choice
        default: NO
        options:
          - NO
          - DEPLOY

permissions:
  contents: read

concurrency:
  group: otyapoint-api-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate canonical OtyaPoint production backend
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.4"
          package-manager-cache: false

      - name: Validate source, contracts and migrations
        run: |
          npm --prefix backend run check
          npm --prefix backend test
          npm --prefix backend run verify:schema

      - name: Validate production Worker configuration
        run: npx --yes wrangler@4.159.0 deploy --dry-run --config wrangler.opoint-production.toml

  deploy:
    name: Deploy private otyapoint-api Worker
    needs: validate
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.confirm_deploy == 'DEPLOY')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Check out the exact validated main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.4"
          package-manager-cache: false

      - name: Verify production Cloudflare credentials
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID" || {
            echo "::error::Set CLOUDFLARE_ACCOUNT_ID in the production GitHub Environment."
            exit 1
          }
          test -n "$CLOUDFLARE_API_TOKEN" || {
            echo "::error::Set the narrowly scoped CLOUDFLARE_API_TOKEN secret in the production GitHub Environment."
            exit 1
          }
          node --input-type=module - <<'NODE'
          const response = await fetch("https://api.cloudflare.com/client/v4/user/tokens/verify", {
            headers: { Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}` },
            signal: AbortSignal.timeout(15000)
          });
          const body = await response.json().catch(() => null);
          if (!response.ok || body?.success !== true || body?.result?.status !== "active") {
            process.stderr.write("Cloudflare token verification failed or the token is inactive.\n");
            process.exit(1);
          }
          process.stdout.write("Cloudflare API token is active.\n");
          NODE

      - name: Deploy the private production Worker (no D1 migrations or public route changes)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4.159.0 deploy --config wrangler.opoint-production.toml

name: Deploy OtyaPoint API

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-api.yml'
      - 'wrangler.toml'
      - 'cloudflare-api/**'
      - 'scripts/**'
  workflow_dispatch:
    inputs:
      confirm:
        description: Type DEPLOY to authorize the private production Worker deployment
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: otyapoint-api-production-deploy
  cancel-in-progress: false

jobs:
  validate:
    name: Validate the exact mainline API release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.4'
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm install --no-audit --no-fund --ignore-scripts

      - name: Validate local configuration and tests
        run: |
          set -euo pipefail
          npm run check:worker
          npm run test:sale-fingerprint
          npm run test:sale-route-idempotency
          npm run test:auth-boundary
          npm run test:agency-list
          npm run test:legacy-products-bridge
          npm run dev:local:check
          npm run test:local-auth
          npm run test:local-runtime
          npm run lint
          npm run build

      - name: Validate production Worker bundle without deploying
        run: npx --yes wrangler@4.159.0 deploy --dry-run --config wrangler.toml

  deploy:
    name: Deploy private OtyaPoint API Worker
    if: github.ref == 'refs/heads/main' && ((github.event_name == 'workflow_dispatch' && inputs.confirm == 'DEPLOY') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[DEPLOY]')))
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.4'
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm install --no-audit --no-fund --ignore-scripts

      - name: Require narrowly scoped production credentials
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          grep -q 'secret_name = "OTYAPOINT_INVITE_SERVICE_TOKEN"' wrangler.toml
          grep -q 'secret_name = "OTYAPOINT_BOOTSTRAP_SECRET"' wrangler.toml
          echo "Cloudflare deployment credentials are present; application secrets are centrally managed by Cloudflare Secrets Store."

      - name: Deploy the private Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4.159.0 deploy --config wrangler.toml

      - name: Record deployment boundary
        run: |
          {
            echo "## OtyaPoint API deployment"
            echo
            echo '- Worker: otyapoint-api.'
            echo "- Target: Cloudflare production account."
            echo "- Public workers.dev route: disabled."
            echo "- Custom domain or DNS: unchanged."
            echo "- D1 migrations: not applied by this workflow."
            echo "- Provider money movement: remains disabled."
            echo "- Browser dashboard: not connected by this deployment."
          } >> "$GITHUB_STEP_SUMMARY"

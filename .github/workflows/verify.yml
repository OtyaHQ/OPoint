name: Verify OtyaPoint

on:
  pull_request:
  push:
    branches: [main, "work/**", "chore/**", "feat/**", "rebuild/**", "test/**"]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cloudflare-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate migration naming and order
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          files = sorted(Path("cloudflare-api/migrations").glob("*.sql"))
          assert files, "No Cloudflare D1 migrations found"
          versions = []
          for path in files:
              match = re.fullmatch(r"(\d{4})_[a-z0-9_]+\.sql", path.name)
              assert match, f"Invalid migration filename: {path.name}"
              versions.append(int(match.group(1)))
          assert versions == list(range(1, len(versions) + 1)), f"Migration versions must be sequential: {versions}"
          print("Validated migrations:", ", ".join(p.name for p in files))
          PY

      - name: Test legacy SQLite migration compatibility
        run: python3 migration/d1/test_schema.py

      - name: Test OmniPoint core schema and stock invariants
        run: python3 cloudflare-api/tests/test_core_schema.py
      - name: Test agency cash and float book invariants
        run: python3 cloudflare-api/tests/test_agency_cash_float_book.py
      - name: Test Otya Enterprise multi-outlet and provider schema
        run: python3 cloudflare-api/tests/test_enterprise_schema.py

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.4'

      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test complete schema health readiness
        run: node --test cloudflare-api/tests/health-readiness.test.mjs
      - name: Test transaction message parsing without provider confirmation
        run: node --test cloudflare-api/tests/transaction-message-parser.test.mjs
      - name: Test Otya Auth staff session lifecycle
        run: node --test cloudflare-api/tests/session.test.mjs

      - name: Validate remaining legacy dashboard Prisma schema
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/omnipoint_ci
        run: npm run db:validate

      - name: Test canonical sale fingerprint
        run: npm run test:sale-fingerprint

      - name: Test sales route idempotency replay behavior
        run: npm run test:sale-route-idempotency

      - name: Test Otya Auth identity and staff authorization boundary
        run: npm run test:auth-boundary

      - name: Test agency transaction list authorization and filtering
        run: npm run test:agency-list

      - name: Test legacy products bridge fails closed
        run: npm run test:legacy-products-bridge

      - name: Test isolated Quickteller Business sandbox adapter
        run: npm run test:quickteller

      - name: Set up Node.js for Miniflare
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.4'

      - name: Install pinned Miniflare D1 test runtime
        run: npm install --no-save --no-package-lock miniflare@4.20260730.0

      - name: Test sales route against isolated Miniflare D1
        run: node --test cloudflare-api/tests/sale-route-d1-runtime.test.mjs

      - name: Type-check Cloudflare Worker
        run: npm run check:worker

      - name: Validate local-only Wrangler configuration
        run: npm run dev:local:check

      - name: Test synthetic local Auth verifier
        run: npm run test:local-auth

      - name: Verify isolated local multi-Worker runtime
        run: npm run test:local-runtime

      - name: Validate and bundle the single Wrangler configuration without deploying
        run: npx --yes wrangler@4.159.0 deploy --dry-run --config wrangler.toml

      - name: Lint
        run: npm run lint

      - name: Test production D1 backup safeguards
        run: node --test scripts/export-d1-backup.test.mjs

      - name: Build dashboard and backend package
        run: npm run build

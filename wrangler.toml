# OtyaPoint Cloudflare configuration.
# This config targets isolated OtyaPoint resources. Do not deploy until release gates pass.
name = "otyapoint-api"
main = "cloudflare-api/src/index.ts"
compatibility_date = "2026-11-09"
workers_dev = false
keep_vars = false

[vars]
# Stable tenant ID inherited from the original schema. It is an internal key,
# not a public product or legal-entity name; do not change without a data migration.
OTYAPOINT_COMPANY_ID = "omnipoint-default"

[observability]
enabled = true
redact_query_string = true

[observability.logs]
enabled = true
head_sampling_rate = 1

[observability.traces]
enabled = true
head_sampling_rate = 0.05

[[d1_databases]]
binding = "DB"
database_name = "otyapoint-db"
database_id = "65cc4aee-154a-474f-9ed4-aabea0924c98"
migrations_dir = "cloudflare-api/migrations"

# Private company evidence, provider receipts, statements and corporate documents.
# Existing R2 bucket; do not enable a public domain on this bucket.
[[r2_buckets]]
binding = "PRIVATE_FILES"
bucket_name = "opoint-private-documents"

# No custom domain, public endpoint, or live payment-provider binding.
[[services]]
binding = "AUTH"
service = "otya-auth"

# Account-level secrets are centrally managed in Cloudflare Secrets Store.
[[secrets_store_secrets]]
binding = "OTYAPOINT_INVITE_SERVICE_TOKEN"
store_id = "a1df6b906c6e4c1da6e7687330ea0f9c"
secret_name = "OTYAPOINT_INVITE_SERVICE_TOKEN"

[[secrets_store_secrets]]
binding = "OTYAPOINT_BOOTSTRAP_SECRET"
store_id = "a1df6b906c6e4c1da6e7687330ea0f9c"
secret_name = "OTYAPOINT_BOOTSTRAP_SECRET"

# Account-level Quickteller Business credentials are isolated to this private Worker.
[[secrets_store_secrets]]
binding = "QUICKTELLER_CLIENT_ID"
store_id = "a1df6b906c6e4c1da6e7687330ea0f9c"
secret_name = "QUICKTELLER_CLIENT_ID"

[[secrets_store_secrets]]
binding = "QUICKTELLER_CLIENT_SECRET"
store_id = "a1df6b906c6e4c1da6e7687330ea0f9c"
secret_name = "QUICKTELLER_CLIENT_SECRET"

[[secrets_store_secrets]]
binding = "QUICKTELLER_MERCHANT_CODE"
store_id = "a1df6b906c6e4c1da6e7687330ea0f9c"
secret_name = "QUICKTELLER_MERCHANT_CODE"

[[secrets_store_secrets]]
binding = "QUICKTELLER_PAY_ITEM_ID"
store_id = "a1df6b906c6e4c1da6e7687330ea0f9c"
secret_name = "QUICKTELLER_PAY_ITEM_ID"

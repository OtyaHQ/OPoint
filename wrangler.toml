# OtyaPoint Cloudflare configuration.
# This config targets isolated OtyaPoint resources. Do not deploy until release gates pass.
name = "otyapoint-api"
main = "cloudflare-api/src/index.ts"
compatibility_date = "2026-10-28"
workers_dev = false
keep_vars = false

[vars]
OTYAPOINT_COMPANY_ID = "omnipoint-default"

[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1

[[d1_databases]]
binding = "DB"
database_name = "otyapoint-db"
database_id = "65cc4aee-154a-474f-9ed4-aabea0924c98"
migrations_dir = "cloudflare-api/migrations"

# No custom domain, public endpoint, or live payment-provider binding.
[[services]]
binding = "AUTH"
service = "otya-auth"

# Account-level secrets are centrally managed in Cloudflare Secrets Store.
[[secrets_store_secrets]]
binding = "OTYAPOINT_INVITE_SERVICE_TOKEN"
store_id = "a1df6b906c6e4c1da6e7687330ea0f9c"
secret_name = "OTYAPOINT_INVITE_SERVICE_TOKEN"

[[secrets_store_secrets]]
binding = "OTYAPOINT_BOOTSTRAP_SECRET"
store_id = "a1df6b906c6e4c1da6e7687330ea0f9c"
secret_name = "OTYAPOINT_BOOTSTRAP_SECRET"

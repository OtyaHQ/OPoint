# LOCAL DEVELOPMENT ONLY.
# Never deploy this file. All bindings use Wrangler's local simulations.
# This configuration deliberately does not bind to production D1/R2/KV/Queues
# or the deployed Otya Auth Worker.

name = "otyapoint-api-local"
main = "cloudflare-api/src/index.ts"
compatibility_date = "2026-11-09"
workers_dev = false
keep_vars = false

[vars]
ENVIRONMENT = "local"

[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1

[[d1_databases]]
binding = "DB"
database_name = "otyapoint-local"
database_id = "11111111-1111-4111-8111-111111111111"
migrations_dir = "cloudflare-api/migrations"

[[services]]
binding = "AUTH"
service = "otyapoint-auth-local"
